aid: avathon
name: Avathon
description: 'Avathon — formerly SparkCognition, rebranded in November 2024 — is an
  industrial AI company whose Industrial AI Platform combines a data platform, industrial
  digital twin, AI modeling and application development layers to bring predictive
  maintenance, asset performance management, visual intelligence and autonomy to physical
  operations. Its solutions span renewables, oil and gas, power and utilities, manufacturing,
  mining, aerospace and defense, maritime, rail, aviation, logistics, warehousing and
  retail, with named offerings including Asset Performance Management, Visual AI /
  Visual Intelligence, Autonomy for Health, Safety and Environment, the Digital Maintenance
  Advisor and the Multidomain Awareness Advisor. The platform is sold and delivered
  as an enterprise engagement — marketing material references an application development
  SDK and APIs, but no public developer portal, API reference or machine-readable specification
  is published; the only documentation surface, support.avathon.com/help, redirects
  to a HubSpot member login. Avathon is backed by investors including Temasek, Verizon
  Ventures and Boeing, and is headquartered in Silicon Valley after relocating from
  Austin, Texas.'
